# Deploiement : appli Rocket Host + n8n + Traefik (HTTPS). Voir docs/deploiement.md
services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      # Decouverte des services par labels, via le filtre socket-proxy (jamais le socket Docker en direct)
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=${HTTPS_REDIRECT_TO:-websecure}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # HTTPS automatique (Let's Encrypt). Pour tester sans risquer la limite de certificats, ajouter :
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --api.dashboard=${TRAEFIK_DASHBOARD:-false}
      - --log.level=INFO
      - --accesslog=false
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/letsencrypt
    networks: [default, socket]
    depends_on: [socket-proxy]

  # Filtre l'API Docker : Traefik ne peut que lister les conteneurs (lecture seule)
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Hotes avec SELinux (Oracle Linux, Fedora) : sans cela le conteneur ne peut pas ouvrir le socket (erreur 503).
    # Sans effet sur Ubuntu/Debian. Limite a ce seul conteneur, qui n'a ni acces reseau externe ni droit d'ecriture Docker.
    security_opt:
      - label=disable
    networks: [socket]

  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Cle maitre des secrets en base (docs/secrets.md) : openssl rand -base64 32, A SAUVEGARDER hors du serveur
      ROCKET_SECRETS_KEY: ${ROCKET_SECRETS_KEY:?ROCKET_SECRETS_KEY manquant dans .env}
      ROCKET_SECRETS_KEY_OLD: ${ROCKET_SECRETS_KEY_OLD:-}
      NUXT_DEMO: ${DEMO:-}
      # --- MIGRATION SEULEMENT (docs/secrets.md) : lus en repli tant qu'ils ne sont pas importes en base
      # (docker compose exec app node --experimental-strip-types scripts/secrets-import-env.mjs), puis a supprimer avec les lignes de .env.
      NUXT_LODGIFY_API_KEY: ${LODGIFY_API_KEY:-}
      NUXT_NUKI_API_TOKEN: ${NUKI_API_TOKEN:-}
      NUXT_WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      NUXT_IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      NUXT_HOMEY_API_KEY: ${HOMEY_API_KEY:-}
      NUXT_HOMEY_CLIENT_ID: ${HOMEY_CLIENT_ID:-}
      NUXT_HOMEY_CLIENT_SECRET: ${HOMEY_CLIENT_SECRET:-}
      NUXT_HOMEY_REDIRECT_URI: ${HOMEY_REDIRECT_URI:-}
    volumes:
      - appdata:/app/.data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_HOST:-app.${DOMAIN:?DOMAIN manquant dans .env}}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.routers.app.middlewares=secure-headers"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # Page menage ouverte par QR code (lien secret, sans mot de passe) : seuls ces chemins passent sans authentification,
      # avec limitation de debit. Les fichiers /_nuxt/ (JS/CSS) et les icones sont necessaires a l'affichage de la page.
      - "traefik.http.routers.app-public.rule=Host(`${APP_HOST:-app.${DOMAIN}}`) && (PathPrefix(`/r/`) || PathPrefix(`/api/r/`) || PathPrefix(`/_nuxt/`) || PathPrefix(`/api/_nuxt_icon/`))"
      - "traefik.http.routers.app-public.priority=1000"
      - "traefik.http.routers.app-public.entrypoints=websecure"
      - "traefik.http.routers.app-public.tls.certresolver=le"
      - "traefik.http.routers.app-public.service=app"
      - "traefik.http.routers.app-public.middlewares=public-ratelimit,secure-headers"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.burst=40"
      # Livret d'accueil et ecran TV (lien secret par logement) : mis a part de app-public ci-dessus pour pouvoir
      # assouplir SEULEMENT ici l'encadrement (iframe), voir middleware public-frame-headers plus bas.
      - "traefik.http.routers.app-tv.rule=Host(`${APP_HOST:-app.${DOMAIN}}`) && (PathPrefix(`/tv/`) || PathPrefix(`/api/tv/`) || PathPrefix(`/g/`) || PathPrefix(`/api/g/`))"
      - "traefik.http.routers.app-tv.priority=1000"
      - "traefik.http.routers.app-tv.entrypoints=websecure"
      - "traefik.http.routers.app-tv.tls.certresolver=le"
      - "traefik.http.routers.app-tv.service=app"
      - "traefik.http.routers.app-tv.middlewares=public-ratelimit,public-frame-headers"
      # Mot de passe Traefik retire (2026-09-23) : l'appli protege deja tout elle-meme (comptes, roles, refus par defaut
      # sur toute route hors pages publiques a jeton) depuis docs/plan-gestion-utilisateurs.md. ADMIN_USERS n'est plus utilise.
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=no-referrer"
      # Meme chose que secure-headers, sauf l'encadrement : SAMEORIGIN au lieu de DENY, uniquement pour /tv/ et /g/
      # (app-tv ci-dessus) — l'editeur du livret affiche /tv/:token dans un iframe (meme origine). Le reste de
      # l'appli (comptes, toutes les pages admin) garde frameDeny=true, sans exception.
      - "traefik.http.middlewares.public-frame-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.public-frame-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.public-frame-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.public-frame-headers.headers.referrerPolicy=no-referrer"

  n8n:
    # ghcr.io plutot que docker.n8n.io/docker.io : les telechargements anonymes Docker Hub sont limites par IP (deja rencontre en local)
    image: ghcr.io/n8n-io/n8n:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      GENERIC_TIMEZONE: Europe/Paris
      N8N_HOST: ${N8N_HOST:-n8n.${DOMAIN}}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-n8n.${DOMAIN}}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant dans .env}
    volumes:
      - n8ndata:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST:-n8n.${DOMAIN}}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.routers.n8n.middlewares=secure-headers"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

networks:
  # Reseau isole : seuls Traefik et le filtre s'y trouvent, sans acces a Internet
  socket:
    internal: true

volumes:
  appdata:
  n8ndata:
  letsencrypt:
