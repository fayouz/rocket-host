# Surcharge pour le developpement en local : noms *.local (a declarer dans /etc/hosts), en HTTP simple (pas de certificat).
# La production (docker-compose.yml seul) reste en HTTPS avec Let's Encrypt.
# Usage : docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env --env-file .env.local up -d
# .env.local (non versionne) : APP_HOST=loussahousing.local  N8N_HOST=n8n.local  TRAEFIK_HOST=traefik.local  HTTP_PORT=8080 ...
services:
  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOST:-traefik.local}`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Pas de mot de passe : usage local uniquement (noms *.local, jamais exposé sur Internet)
  app:
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_HOST:-loussahousing.local}`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.middlewares=secure-headers"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      - "traefik.http.routers.app-public.rule=Host(`${APP_HOST:-loussahousing.local}`) && (PathPrefix(`/r/`) || PathPrefix(`/api/r/`) || PathPrefix(`/_nuxt/`) || PathPrefix(`/api/_nuxt_icon/`))"
      - "traefik.http.routers.app-public.priority=1000"
      - "traefik.http.routers.app-public.entrypoints=web"
      - "traefik.http.routers.app-public.service=app"
      - "traefik.http.routers.app-public.middlewares=public-ratelimit,secure-headers"
      - "traefik.http.routers.app-tv.rule=Host(`${APP_HOST:-loussahousing.local}`) && (PathPrefix(`/tv/`) || PathPrefix(`/api/tv/`) || PathPrefix(`/g/`) || PathPrefix(`/api/g/`))"
      - "traefik.http.routers.app-tv.priority=1000"
      - "traefik.http.routers.app-tv.entrypoints=web"
      - "traefik.http.routers.app-tv.service=app"
      - "traefik.http.routers.app-tv.middlewares=public-ratelimit,public-frame-headers"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.public-ratelimit.ratelimit.burst=40"
      - "traefik.http.middlewares.secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.public-frame-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.public-frame-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.public-frame-headers.headers.referrerPolicy=no-referrer"
  n8n:
    image: ghcr.io/n8n-io/n8n:latest
    environment:
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://${N8N_HOST:-n8n.local}:${HTTP_PORT:-80}/
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST:-n8n.local}`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.routers.n8n.middlewares=secure-headers"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
